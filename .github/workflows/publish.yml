name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "dsh 版本（留空 = 取 npm 上的 latest）"
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dsh

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析要发布的 dsh 版本
        id: resolve
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then
            v="$(npm view @deepseek-ai/dsh dist-tags.latest)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "解析到 dsh 版本：$v"

      - name: 判断是否需要构建
        id: gate
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE:${{ steps.resolve.outputs.version }}" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          if [ "$exists" = "false" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "该版本已发布，跳过构建"
          fi

      - name: 计算镜像标签（手动触发才更新 latest）
        id: tags
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          tags="$IMAGE:${{ steps.resolve.outputs.version }}"
          tags="$tags"$'\n'"$IMAGE:sha-${GITHUB_SHA::12}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tags="$tags"$'\n'"$IMAGE:latest"
          fi
          printf '%s\n' "$tags"
          {
            echo "tags<<TAGS_EOF"
            printf '%s\n' "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.gate.outputs.run == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'

      - name: 构建并推送 linux/amd64 + linux/arm64
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            DSH_VERSION=${{ steps.resolve.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 校验镜像里的 dsh 版本
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          image="$IMAGE:${{ steps.resolve.outputs.version }}"
          want="${{ steps.resolve.outputs.version }}"
          docker pull "$image"
          got="$(docker run --rm "$image" dsh -V)"
          echo "镜像内 dsh 版本=$got  期望=$want"
          [ "$got" = "$want" ] || { echo "::error::版本不一致"; exit 1; }
